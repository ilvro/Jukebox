<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>Jukebox</title>  
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="images/page_icon.jpg">
    </head>

    <body>
        <div id="dimmer"></div>
        <div id="filter-dimmer"></div>
        <header class="top-header">
            <h1 class="main-title">JUKEBOX</h1>
            <nav class="navbar-home-playlists">
                <div class="header-dropdown">
                    <button id="manage-songs-btn">Manage Songs</button>
                    <div class="dropdown-content">
                        <div class="upload-container" id="upload-song-btn">
                            <button>Upload Song</button>
                        </div>  

                        <div class="upload-container" id="save-preset-btn">
                            <label>Save Preset</label>
                        </div>
        
                        <div class="upload-container" id="load-preset-btn">
                            <label>Load Preset</label>
                        </div>

                        <div class="upload-container" id="load-sample-btn">
                            <label>Load Sample Preset</label>
                        </div>
                        </div>
                    </div>
                </div>
                <label> | </label>
                <button class="show-player-button" id="show-player-button" onclick="showPlayer()">Show Player</button>
                <label> | </label>
                <button class="show-player-button" id="show-hotkeys-button" onclick="toggleHotkeyPanel()">Show Hotkeys</button>
                <label> | </label>
                <button class="show-player-button" id="show-scenes-button" aria-controls="scene-panel" aria-expanded="false">Scenes</button>
                <label> | </label>
                <button class="show-player-button" id="settings-button">Settings</button>
            </nav>
        </header>

        <div id="player-hover-zone" aria-hidden="true"></div>
        <div class="player-container" id="player-container">
            <div class="player-header">
                <h1>NOW PLAYING</h1>
                <div class="player-controls">
                    <div class="master-volume-control">
                        <label for="master-volume-slider">Master</label>
                        <input type="range" id="master-volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
                    </div>
                    <button id="hotkey-mode-button" class="button">Hotkeys: Fade</button>
                    <button id="stop-all-button" class="red-button">Stop All</button>
                </div>
            </div>
            <div class="track-list" id="track-list"></div>
        </div>

        <div class="hotkey-panel" id="hotkey-panel">
            <h1>HOTKEYS</h1>
            <div class="hotkey-panel-list" id="hotkey-panel-list"></div>
        </div>

        <aside class="scene-panel" id="scene-panel" aria-hidden="true">
            <div class="scene-panel-header">
                <div>
                    <h1>SCENES</h1>
                    <p>Recall an entire mix with one click.</p>
                </div>
                <button type="button" id="close-scenes-button" class="scene-panel-close" aria-label="Close scenes">×</button>
            </div>
            <button type="button" id="create-scene-button" class="scene-create-button">+ Save Current Mix</button>
            <div class="scene-list" id="scene-list"></div>
        </aside>

        <div class="scene-dialog-overlay" id="scene-dialog-overlay" hidden>
            <form class="scene-dialog" id="scene-dialog">
                <h2 id="scene-dialog-title">Save Scene</h2>
                <p id="scene-dialog-description"></p>
                <input id="scene-name-input" maxlength="60" autocomplete="off" placeholder="Scene name">
                <div class="scene-dialog-actions">
                    <button type="button" id="scene-dialog-cancel">Cancel</button>
                    <button type="submit" id="scene-dialog-confirm">Save Scene</button>
                </div>
            </form>
        </div>

        <div class="genre-filters">
            <input placeholder=" Search for..." id="searchBar">
            <div class="filter-dropdown" id="filter-dropdown">
                <button class="filter-dropdown-button">Filter by...  ▼</button>
                <div class="filter-dropdown-content">
                    <div class="filter-category-header">View</div>
                    <div class="filter-option">Show All</div>
                    <div class="filter-option">Now Playing</div>

                    <div class="filter-category-header">Mood</div>
                    <div class="filter-option">fun</div>
                    <div class="filter-option">hopeful</div>
                    <div class="filter-option">emotional</div>
                    <div class="filter-option">investigation</div>
                    
                    <div class="filter-category-header">Intensity</div>
                    <div class="filter-option">mystery</div>
                    <div class="filter-option">suspense</div>
                    <div class="filter-option">horror</div>
                    <div class="filter-option">battle</div>
                    
                    <div class="filter-category-header">Atmosphere</div>
                    <div class="filter-option">ambient</div>
                    <div class="filter-option">event</div>
                    <div class="filter-option">sfx</div>
                </div>
            </div>
            <button
                type="button"
                id="view-mode-button"
                class="view-mode-button"
                aria-controls="song-grid"
                aria-pressed="false"
                title="Show more songs using a compact list"
            >Compact View</button>

            </div>

            <div class="song-grid-container">
                <div class="song-grid" id="song-grid">
                </div>           
            </div>

            <div id="upload-popup" class="popup">
                <header class="popup-header">
                    <div class="upload-end-btns">
                        <button id="upload-submit" class="button">Upload</button>
                        <button id="upload-cancel" class="red-button">X</button>
                    </div>
                </header>
                <div class="popup-content">
                    <br><br>
                    <div class="upload-step">
                        <label>1. Select a .mp3 or .mp4 file:</label>
                        <div class="input-box">
                            <input type="file" id="song-file" accept=".mp3,.mp4">
                            <label id="or">or</label>
                            <input id="youtube-link" placeholder=" Paste a youtube link here...">
                        </div>
                    </div>

                    <br>
                    <div class="upload-step">
                        <label>2. Select an image to use as thumbnail:</label>
                        <div class="input-box">
                            <input type="file" id="thumbnail-file" accept="image/*">
                        </div>
                    </div>

                    <br>
                    <div class="upload-step">
                        <label>3. Select the song's genres:</label>
                        <div class="genre-checkboxes" id="tag-checkboxes">
                            <input type="checkbox" id="tag-ambient" name="tag" value="ambient">
                            <label for="tag-ambient" class="genre-btn">ambient</label>
    
                            <input type="checkbox" id="tag-investigation" name="tag" value="investigation">
                            <label for="tag-investigation" class="genre-btn">investigation</label>

                            <input type="checkbox" id="tag-event" name="tag" value="event">
                            <label for="tag-event" class="genre-btn">event</label>

                            <input type="checkbox" id="tag-battle" name="tag" value="battle">
                            <label for="tag-battle" class="genre-btn">battle</label>

                            <input type="checkbox" id="tag-emotional" name="tag" value="emotional">
                            <label for="tag-emotional" class="genre-btn">emotional</label>
                        </div> 
                        
                            <div class="genre-checkboxes" id="genre-checkboxes">
                            <input type="checkbox" id="genre-fun" name="genre" value="fun">
                            <label for="genre-fun" class="genre-btn">fun</label>
    
                            <input type="checkbox" id="genre-hopeful" name="genre" value="hopeful">
                            <label for="genre-hopeful" class="genre-btn">hopeful</label>
    
                            <input type="checkbox" id="genre-mystery" name="genre" value="mystery">
                            <label for="genre-mystery" class="genre-btn">mystery</label>

                            <input type="checkbox" id="genre-suspense" name="genre" value="suspense">
                            <label for="genre-suspense" class="genre-btn">suspense</label>
    
                            <input type="checkbox" id="genre-horror" name="genre" value="horror">
                            <label for="genre-horror" class="genre-btn">horror</label>

                            <input type="checkbox" id="genre-sfx" name="genre" value="sfx">
                            <label for="genre-sfx" class="genre-btn">sfx</label>

                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="settings-popup" class="popup">
            <header class="popup-header">
                <div class="upload-end-btns">
                    <button id="settings-cancel" class="red-button">X</button>
                </div>
            </header>
            <div class="popup-content">
                <br><br>
                <div class="upload-step">
                    <label>Fade duration (seconds):</label>
                    <div class="input-box">
                        <input type="number" id="fade-duration-input" min="0.5" max="15" step="0.5">
                    </div>
                </div>

                <br>
                <div class="upload-step">
                    <label>Background image:</label>
                    <div class="input-box">
                        <input type="file" id="background-image-input" accept="image/*">
                        <label id="or">or</label>
                        <button id="reset-background-btn" class="red-button">Reset to default</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
        <script type="module" src="filters.js"></script>
        <script type="module" src="player.js"></script>
        <script type="module" src="upload-song.js"></script>
        <script type="module" src="settings.js"></script>
        <script type="module" src="scenes.js"></script>
    </body>
</html>
